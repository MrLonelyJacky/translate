services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docbridge-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8090
      DB_URL: ${DB_URL:?Set DB_URL in .env}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_AUTH_ENABLED: "true"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env}
      APP_OCR_TENCENT_SECRET_ID: ${APP_OCR_TENCENT_SECRET_ID:?Set APP_OCR_TENCENT_SECRET_ID in .env}
      APP_OCR_TENCENT_SECRET_KEY: ${APP_OCR_TENCENT_SECRET_KEY:?Set APP_OCR_TENCENT_SECRET_KEY in .env}
      APP_OCR_TENCENT_REGION: ${APP_OCR_TENCENT_REGION:-ap-beijing}
      APP_TRANSLATE_ENABLED: "true"
      APP_TRANSLATE_TENCENT_SECRET_ID: ${APP_TRANSLATE_TENCENT_SECRET_ID:?Set APP_TRANSLATE_TENCENT_SECRET_ID in .env}
      APP_TRANSLATE_TENCENT_SECRET_KEY: ${APP_TRANSLATE_TENCENT_SECRET_KEY:?Set APP_TRANSLATE_TENCENT_SECRET_KEY in .env}
      APP_TRANSLATE_TENCENT_REGION: ${APP_TRANSLATE_TENCENT_REGION:-ap-beijing}
      APP_TRANSLATE_TENCENT_PROJECT_ID: ${APP_TRANSLATE_TENCENT_PROJECT_ID:-0}
      APP_FREE_TOTAL: ${APP_FREE_TOTAL:-1000}
      APP_WECHAT_ENABLED: "true"
      APP_WECHAT_APP_ID: ${APP_WECHAT_APP_ID:?Set APP_WECHAT_APP_ID in .env}
      APP_WECHAT_APP_SECRET: ${APP_WECHAT_APP_SECRET:?Set APP_WECHAT_APP_SECRET in .env}
      APP_WECHAT_REDIRECT_URI: ${APP_WECHAT_REDIRECT_URI:?Set APP_WECHAT_REDIRECT_URI in .env}
      APP_WECHAT_FRONTEND_ORIGIN: ${APP_WECHAT_FRONTEND_ORIGIN:?Set APP_WECHAT_FRONTEND_ORIGIN in .env}
    volumes:
      - backend-storage:/app/data/storage
    expose:
      - "8090"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: docbridge-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  backend-storage:
