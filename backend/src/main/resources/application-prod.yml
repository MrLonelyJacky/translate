spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/translate?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true


logging:
  level:
    org.mybatis: DEBUG
    org.mybatis.spring: DEBUG
    com.baomidou.mybatisplus: DEBUG

